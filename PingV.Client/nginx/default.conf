# HTTP: redirect all traffic to HTTPS 
server {
  listen 80; 
  server_name localhost;  

  return 301 https://$host$request_uri; 
}

# HTTPS: serve the Angular app 
server {
  listen 443 ssl;
  server_name localhost; 

  ssl_certificate /https/localhost.pem;
  ssl_certificate_key /https/localhost-key.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  root /usr/share/nginx/html;
  index index.html;

  # ASP.NET Core reverse proxy 
  location /api/ {
    # proxy to the API container 
    proxy_pass http://aspnetcoreapi:8080;
    
    # reverse proxy headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # redirect all other routes to index.html for Angular's routing
  location / {
    try_files $uri $uri/ /index.html;
  }
  
  # caching for static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000";
  }
}