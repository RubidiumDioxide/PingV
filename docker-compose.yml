services:
  sqldata: 
    image: postgres:latest  
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER} 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5   


  rediscache:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD} 
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  schedule:
    image: ${DOCKER_REGISTRY-}schedule
    build:
      context: .
      dockerfile: Services/Schedule/Dockerfile
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development 
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSQL=Host=sqldata;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD} 
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      sqldata:
        condition: service_healthy
      rediscache:
        condition: service_healthy


  webapigateway:
    image: ${DOCKER_REGISTRY-}webapigateway
    build:
      context: .
      dockerfile: APIGateways/WebAPIGateway/Dockerfile 
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development 
      - ASPNETCORE_URLS=https://+:8080 
      - ASPNETCORE_Kestrel__Certificates__Default__Path=${ASPNETDEVCERT_PATH}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETDEVCERT_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ~/.aspnet/https:/https:ro 
    depends_on:
      schedule:
        condition: service_healthy