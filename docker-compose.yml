services:
  postgres: 
    image: postgres:latest 
    container_name: postgres
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER} 
    networks: 
      - pingvdevnetwork 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
            
  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD} 
    networks:
      - pingvdevnetwork   
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  aspnetcoreapi:
    build:
      context: .
      dockerfile: PingV.API/Dockerfile
    container_name: aspnetcoreapi 
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development 
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD} 
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
    networks:
      - pingvdevnetwork 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  nginx:
    build:
      context: PingV.Client/
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ~/.angular/https:/https:ro 
    networks:
      - pingvdevnetwork 
    depends_on: 
      - aspnetcoreapi
      
networks:
  pingvdevnetwork:
    driver: bridge