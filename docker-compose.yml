services:
  postgresdb: 
    image: postgres:latest  
    command: -p ${POSTGRES_PORT}
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER} 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5   


  rediscache:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:4-management
    hostname: ${RABBITMQ_HOST} 
    environment: 
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER} 
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5


  schedule:
    image: ${DOCKER_REGISTRY-}schedule
    build:
      context: .
      dockerfile: Services/Schedule/Dockerfile
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development 
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSQL=Host=postgresdb;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD} 
      - ConnectionStrings__Redis=rediscache:${REDIS_PORT},password=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgresdb:
        condition: service_healthy
      rediscache:
        condition: service_healthy
      rabbitmq: 
        condition: service_healthy 

  wishlist: 
    image: ${DOCKER_REGISTRY-}wishlist
    build:
      context: .
      dockerfile: Services/Wishlist/Dockerfile 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD} 
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgresdb:
        condition: service_healthy
      rediscache:
        condition: service_healthy
      rabbitmq: 
        condition: service_healthy 


  webapigateway:
    image: ${DOCKER_REGISTRY-}webapigateway
    build:
      context: .
      dockerfile: APIGateways/WebAPIGateway/Dockerfile 
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development 
      - ASPNETCORE_URLS=https://+:8080 
      - ASPNETCORE_Kestrel__Certificates__Default__Path=${ASPNETDEVCERT_PATH}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETDEVCERT_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ~/.aspnet/https:/https:ro 
    depends_on:
      schedule:
        condition: service_healthy
      wishlist:
        condition: service_healthy